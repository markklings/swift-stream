<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swift Stream - Watch Free Movies & TV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #09090b; color: #f4f4f5; font-family: system-ui, -apple-system, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .purple-glow { box-shadow: 0 0 25px -5px rgba(168, 85, 247, 0.3); }
  </style>
</head>
<body class="min-h-screen">

  <!-- Solid Clean Header (No Blur) -->
  <header class="fixed top-0 left-0 w-full z-50 bg-gradient-to-b from-[#09090b] via-[#09090b]/90 to-transparent px-6 py-4 flex items-center justify-between">
    <a href="/" class="flex items-center gap-3 group">
      <!-- Swift Logo SVG -->
      <svg class="w-8 h-8 text-purple-500 fill-current group-hover:scale-105 transition-transform drop-shadow-[0_0_8px_rgba(168,85,247,0.8)]" viewBox="0 0 128 128">
        <path d="M115.6 98.7c-4.9 6.2-12.7 12.3-21.4 16.2 2.7-3.8 5-8.2 6.5-12.9 2.2-6.7 2.4-13.6.8-19.8-1.8-7.3-6.4-13.7-12.7-18.7 1.8 3.9 2.7 8.2 2.4 12.6-.5 6.7-4.1 12.9-9.5 17.2-5.4 4.3-12.4 6.6-19.3 6.3 3.9-3.2 7.1-7.2 9.2-11.8 2.2-4.9 3.1-10.3 2.5-15.6-.9-7.8-5.3-14.8-11.8-19.3C52.7 48.4 44 46.5 35.8 48c4.6 2.8 8.4 6.7 10.9 11.4 2.6 4.9 3.6 10.6 2.8 16.1-1.2 8.2-6.7 15.3-14.1 19.3 6.1-1.4 11.9-4.2 16.7-8.3-8.8 6.5-19.5 10.3-30.8 11-1.2.1-2.4 0-3.6-.1 12.8-5.8 23.3-15.2 30-26.9 7.8-13.6 9.6-29.6 5.1-44.8C50 14.6 38.3 5.4 24.3 1c20.3 3.6 37.9 14.7 48.9 31 10.5-10.4 23.8-17.8 38.4-20.9-8.4 6.7-14.9 15.4-18.8 25.2 10.6-6.1 22.8-8.8 34.9-7.8-8.5 5.7-15.8 13.1-21.2 21.8 10.1 2.3 19.6 7.3 27.5 14.4-6.9.3-13.7-1.3-19.8-4.6 4.9 8.2 6.8 17.9 5.4 27.4-.3 2.1-.8 4.2-1.4 6.2z"/>
      </svg>
      <span class="text-xl font-black tracking-widest text-white">SWIFT<span class="text-purple-500">STREAM</span></span>
    </a>

    <!-- Search Trigger Button -->
    <button id="open-search" class="flex items-center gap-2 bg-zinc-900 hover:bg-purple-950/60 border border-zinc-800 hover:border-purple-500/50 px-4 py-2 rounded-full text-xs font-semibold text-zinc-300 transition-all">
      <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <span>Search titles...</span>
    </button>
  </header>

  <!-- Infinite 5-Movie Hero Slider -->
  <section id="hero-slider" class="relative w-full h-[75vh] md:h-[85vh] bg-zinc-950 overflow-hidden flex items-end">
    <div id="hero-bg" class="absolute inset-0 bg-cover bg-center transition-all duration-700"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-[#09090b] via-[#09090b]/50 to-transparent"></div>

    <div class="relative z-10 max-w-3xl p-6 md:p-16 space-y-4">
      <span class="px-3 py-1 text-[10px] font-bold uppercase rounded-full bg-purple-600/30 text-purple-300 border border-purple-500/30 tracking-widest">Featured</span>
      <h1 id="hero-title" class="text-4xl md:text-6xl font-black tracking-tight text-white">Loading...</h1>
      <p id="hero-overview" class="text-sm md:text-base text-zinc-400 line-clamp-3 leading-relaxed"></p>

      <div class="pt-2 flex items-center gap-4">
        <a id="hero-play-btn" href="#" class="inline-flex items-center gap-2 px-8 py-3.5 bg-purple-600 hover:bg-purple-500 text-white font-bold text-sm rounded-full transition-all purple-glow">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          Watch Movie
        </a>
      </div>

      <!-- Slide Indicator Dots -->
      <div id="hero-dots" class="flex gap-2 pt-6"></div>
    </div>
  </section>

  <!-- Catalog Content -->
  <main class="p-6 md:p-16 space-y-12 relative z-20 -mt-10">

    <!-- Inside views/index.html, inside the <main> element, above Top Movies -->

    <!-- Continue Watching Row (Dynamically Displayed if LocalStorage contains items) -->
    <section id="continue-watching-section" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-purple-500 animate-pulse"></span> Continue Watching
        </h2>
        <button onclick="clearHistory()" class="text-xs text-zinc-500 hover:text-purple-400 transition-colors">Clear</button>
      </div>

      <div id="continue-watching-container" class="flex gap-5 overflow-x-auto no-scrollbar pb-4 scroll-smooth"></div>
    </section>

    <!-- Top Movies Selector Row -->
    <section class="space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-purple-500"></span> Top Movies
        </h2>
        <div class="flex gap-2">
          <button onclick="scrollRow('movies-container', -400)" class="p-2 rounded-full bg-zinc-900 hover:bg-purple-900/40 border border-zinc-800 text-zinc-300 hover:text-white transition-colors">
            ‹
          </button>
          <button onclick="scrollRow('movies-container', 400)" class="p-2 rounded-full bg-zinc-900 hover:bg-purple-900/40 border border-zinc-800 text-zinc-300 hover:text-white transition-colors">
            ›
          </button>
        </div>
      </div>

      <div id="movies-container" class="flex gap-5 overflow-x-auto no-scrollbar pb-4 scroll-smooth"></div>
    </section>

    <!-- Top TV Shows Row -->
    <section class="space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-purple-500"></span> Popular TV Series
        </h2>
        <div class="flex gap-2">
          <button onclick="scrollRow('tv-container', -400)" class="p-2 rounded-full bg-zinc-900 hover:bg-purple-900/40 border border-zinc-800 text-zinc-300 hover:text-white transition-colors">
            ‹
          </button>
          <button onclick="scrollRow('tv-container', 400)" class="p-2 rounded-full bg-zinc-900 hover:bg-purple-900/40 border border-zinc-800 text-zinc-300 hover:text-white transition-colors">
            ›
          </button>
        </div>
      </div>

      <div id="tv-container" class="flex gap-5 overflow-x-auto no-scrollbar pb-4 scroll-smooth"></div>
    </section>

  </main>

  <!-- Search Modal -->
  <div id="search-modal" class="fixed inset-0 z-50 bg-black/95 hidden flex-col p-6 md:p-12">
    <div class="max-w-4xl mx-auto w-full space-y-6">
      <div class="flex items-center justify-between border-b border-purple-900/30 pb-4">
        <div class="flex items-center gap-3 w-full mr-4">
          <svg class="w-6 h-6 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input id="search-input" type="text" placeholder="Search movies or TV shows..." class="w-full bg-transparent text-xl text-white outline-none placeholder:text-zinc-600" />
        </div>
        <button id="close-search" class="p-2 text-zinc-400 hover:text-white rounded-full bg-zinc-900 border border-zinc-800">✕</button>
      </div>

      <div id="search-results" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 max-h-[70vh] overflow-y-auto no-scrollbar pt-2"></div>
    </div>
  </div>

  <script>
    const IMG_BASE = 'https://image.tmdb.org/t/p/w500';
    const HERO_BASE = 'https://image.tmdb.org/t/p/original';

    let heroMovies = [];
    let currentHeroIndex = 0;

    async function loadCatalog() {
      const movieRes = await fetch('/api/trending/movie');
      const movieData = await movieRes.json();
      const movies = movieData.results || [];

      heroMovies = movies.slice(0, 5);
      setupHeroSlider();

      renderCards('movies-container', movies, 'movie');

      const tvRes = await fetch('/api/trending/tv');
      const tvData = await tvRes.json();
      renderCards('tv-container', tvData.results || [], 'tv');
    }

    function setupHeroSlider() {
      if (heroMovies.length === 0) return;

      const dotsContainer = document.getElementById('hero-dots');
      dotsContainer.innerHTML = heroMovies.map((_, idx) => `
        <button onclick="setHeroSlide(${idx})" class="h-1.5 rounded-full transition-all duration-300 ${idx === 0 ? 'w-8 bg-purple-500' : 'w-2 bg-zinc-700'}"></button>
      `).join('');

      updateHeroDisplay();

      setInterval(() => {
        currentHeroIndex = (currentHeroIndex + 1) % heroMovies.length;
        updateHeroDisplay();
      }, 5000);
    }

    function setHeroSlide(index) {
      currentHeroIndex = index;
      updateHeroDisplay();
    }

    function updateHeroDisplay() {
      const hero = heroMovies[currentHeroIndex];
      if (!hero) return;

      document.getElementById('hero-bg').style.backgroundImage = `url('${HERO_BASE}${hero.backdrop_path}')`;
      document.getElementById('hero-title').textContent = hero.title || hero.name;
      document.getElementById('hero-overview').textContent = hero.overview;
      document.getElementById('hero-play-btn').href = `/movie/${hero.id}`;

      const dots = document.getElementById('hero-dots').children;
      Array.from(dots).forEach((dot, idx) => {
        dot.className = `h-1.5 rounded-full transition-all duration-300 ${idx === currentHeroIndex ? 'w-8 bg-purple-500' : 'w-2 bg-zinc-700'}`;
      });
    }

    function renderCards(containerId, items, type) {
      const container = document.getElementById(containerId);
      container.innerHTML = items.map(item => `
        <a href="/${type}/${item.id}" class="flex-none w-44 md:w-52 aspect-[2/3] bg-zinc-900 border border-zinc-800/80 rounded-2xl overflow-hidden hover:border-purple-500/50 hover:scale-105 transition-all duration-300 group relative">
          <img src="${item.poster_path ? IMG_BASE + item.poster_path : 'https://via.placeholder.com/500x750'}" class="w-full h-full object-cover" />
          <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity p-4 flex flex-col justify-end">
            <span class="text-[10px] text-purple-400 font-bold uppercase tracking-wider">${type}</span>
            <p class="text-xs font-bold text-white truncate">${item.title || item.name}</p>
            <p class="text-[10px] text-zinc-400 mt-1">★ ${item.vote_average ? item.vote_average.toFixed(1) : 'N/A'}</p>
          </div>
        </a>
      `).join('');
    }

    function scrollRow(containerId, amount) {
      document.getElementById(containerId).scrollBy({ left: amount, behavior: 'smooth' });
    }

    const searchModal = document.getElementById('search-modal');
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');

    document.getElementById('open-search').onclick = () => {
      searchModal.classList.remove('hidden');
      searchModal.classList.add('flex');
      searchInput.focus();
    };

    document.getElementById('close-search').onclick = () => {
      searchModal.classList.add('hidden');
      searchModal.classList.remove('flex');
    };

    let debounceTimer;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      const query = e.target.value.trim();
      if (!query) { searchResults.innerHTML = ''; return; }

      debounceTimer = setTimeout(async () => {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();
        const results = (data.results || []).filter(i => i.media_type === 'movie' || i.media_type === 'tv');

        searchResults.innerHTML = results.map(item => `
          <a href="/${item.media_type}/${item.id}" class="bg-zinc-900 border border-zinc-800 hover:border-purple-500/40 rounded-xl overflow-hidden hover:scale-105 transition-all p-2 flex gap-3 items-center">
            <img src="${item.poster_path ? IMG_BASE + item.poster_path : 'https://via.placeholder.com/100x150'}" class="w-12 h-16 object-cover rounded-lg" />
            <div class="overflow-hidden">
              <p class="text-xs font-bold text-white truncate">${item.title || item.name}</p>
              <span class="text-[10px] text-purple-400 uppercase tracking-widest">${item.media_type}</span>
            </div>
          </a>
        `).join('');
      }, 300);
    });

    // Render Continue Watching Cards from LocalStorage
    function loadContinueWatching() {
      const history = JSON.parse(localStorage.getItem('swiftstream_history') || '[]');
      const section = document.getElementById('continue-watching-section');
      const container = document.getElementById('continue-watching-container');

      if (history.length === 0) {
        section.classList.add('hidden');
        return;
      }

      section.classList.remove('hidden');
      container.innerHTML = history.map(item => `
        <a href="${item.watchUrl}" class="flex-none w-44 md:w-52 aspect-[2/3] bg-zinc-900 border border-purple-500/30 rounded-2xl overflow-hidden hover:border-purple-500 hover:scale-105 transition-all duration-300 group relative">
          <img src="${item.poster_path ? IMG_BASE + item.poster_path : 'https://via.placeholder.com/500x750'}" class="w-full h-full object-cover" />
          <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent p-4 flex flex-col justify-end">
            <span class="text-[10px] text-purple-400 font-bold uppercase tracking-wider">
              ${item.type === 'tv' ? `S${item.season} E${item.episode}` : 'Movie'}
            </span>
            <p class="text-xs font-bold text-white truncate">${item.title}</p>
            <div class="w-full bg-zinc-800 h-1 rounded-full mt-2 overflow-hidden">
              <div class="bg-purple-500 h-full w-2/3"></div>
            </div>
          </div>
        </a>
      `).join('');
    }

    function clearHistory() {
      localStorage.removeItem('swiftstream_history');
      loadContinueWatching();
    }

    // Call inside page load
    loadContinueWatching();

    loadCatalog();
  </script>
</body>
</html>
